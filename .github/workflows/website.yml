name: website
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/website.yml'
  # Publishing is deliberately manual: run this workflow from the Actions tab.
  workflow_dispatch:
  # Releases are posted to mica-res on mica-build's own schedule and nothing
  # there triggers a build here, so the catalogue is refreshed on a clock too.
  schedule:
    - cron: '17 * * * *'

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # The build reads ../docs, so a documentation change rebuilds the site.
      - run: bun run build

  # Reads the documents mica-res derives from the posted releases
  # (catalog/products.json and each product's document), checks them against
  # the site's boards, and publishes the download catalogue into KV. Before the
  # first release is posted the catalogue is published empty.
  catalog:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check:catalog
      - run: bun run publish:catalog
      - name: Publish the catalogue to KV
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: '4.131.2'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: kv key put catalog --binding KV --remote --path .tmp/catalog.json
      - name: Publish the status to KV
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: '4.131.2'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: kv key put catalog-status --binding KV --remote --path .tmp/catalog-status.json

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [checks, catalog]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website
      - name: Upload to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          # v4 defaults to whatever Wrangler 4 is latest; pinned so a deploy is
          # reproducible. Wrangler 3 cannot deploy assets without an entry point.
          wranglerVersion: '4.131.2'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
