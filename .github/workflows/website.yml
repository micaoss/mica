name: website
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/website.yml'
  # Publishing is deliberately manual: run this workflow from the Actions tab.
  workflow_dispatch:
  # mica-build publishes on its own schedule and a change there triggers nothing
  # here, so the live index is checked on a clock too.
  schedule:
    - cron: '17 * * * *'

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # The build reads ../docs, so a documentation change rebuilds the site.
      - run: bun run build

  # Reads mica-build's live mica-index.json and fails if the site cannot parse a
  # published product or does not list a release-target board. Both have
  # happened, and both passed every unit test because the fixtures predated the
  # change upstream.
  index:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:index
      # Built here and written to KV from here: the Worker cannot read GitHub
      # from Cloudflare's shared egress without being rate-limited.
      - run: bun run publish:catalog
      - name: Publish the catalogue to KV
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: '4.131.2'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: kv key put catalog --binding KV --remote --path .tmp/catalog.json
      - name: Publish the status to KV
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: '4.131.2'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: kv key put catalog-status --binding KV --remote --path .tmp/catalog-status.json

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [checks, index]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website
      - name: Upload to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          # v4 defaults to whatever Wrangler 4 is latest; pinned so a deploy is
          # reproducible. Wrangler 3 cannot deploy assets without an entry point.
          wranglerVersion: '4.131.2'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
