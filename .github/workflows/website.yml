name: website
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/website.yml'
  # Publishing is deliberately manual: run this workflow from the Actions tab.
  workflow_dispatch:
    inputs:
      target:
        description: 'site (micaos.dev) or setup (the provisioning page, wrangler.setup.jsonc)'
        type: choice
        options: [site, setup]
        default: site

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # The build reads ../docs, so a documentation change rebuilds the site.
      - run: bun run build
      - run: bun run build:setup

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'site'
    needs: [checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website
      - name: Upload to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          # v4 defaults to whatever Wrangler 4 is latest; pinned so a deploy is
          # reproducible. Wrangler 3 cannot deploy assets without an entry point.
          wranglerVersion: '4.131.2'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website

  deploy-setup:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'setup'
    needs: [checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build:setup
        working-directory: website
      - name: Upload to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: '4.131.2'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy --config wrangler.setup.jsonc
      # After the page: this takes the old host, setup-test.micaos.dev, over
      # from the page's Worker and answers it with a 301 to init.micaos.dev.
      - name: Redirect the old host
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: '4.131.2'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy --config wrangler.setup-redirect.jsonc
