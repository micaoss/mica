name: website
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/website.yml'
  # Publishing is deliberately manual: run this workflow from the Actions tab.
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # The build reads ../docs, so a documentation change rebuilds the site.
      - run: bun run build

  # The download catalogue read mica-build's mica-index.json, which no release
  # publishes since products release one by one. It moves to the documents
  # mica-res derives (catalog/products.json) once releases are posted there;
  # until then the catalogue is neither checked nor republished here.

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website
      - name: Upload to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          # v4 defaults to whatever Wrangler 4 is latest; pinned so a deploy is
          # reproducible. Wrangler 3 cannot deploy assets without an entry point.
          wranglerVersion: '4.131.2'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
